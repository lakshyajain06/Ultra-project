[build-system]
requires = ["setuptools>=77,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-isaaclab-scene"
version = "0.1.0"
description = "Ultra simulation, demonstration data, and robot-learning workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "isaaclab[isaacsim]==3.0.0b2.post1",
    "h5py>=3.14,<4",
    "hydra-core>=1.3,<2",
    "python-dotenv>=1.1,<2",
    "scipy>=1.15,<2",
    "wandb>=0.21,<1",
]

[project.optional-dependencies]
teleop = ["isaacteleop[cloudxr]==1.4.142; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"learning.training.conf" = ["*.yaml"]
"learning.training.conf.dataset" = ["*.yaml"]
"learning.training.conf.model" = ["*.yaml"]
"learning.training.conf.train" = ["*.yaml"]
"learning.training.conf.trainer" = ["*.yaml"]
"learning.training.conf.wandb" = ["*.yaml"]

[tool.uv]
index-strategy = "unsafe-best-match"
prerelease = "allow"
# Isaac Sim 6.0.1 pins websockets 12, but Isaac Teleop's CloudXR proxy uses
# websockets.asyncio (>=14). Keep the override explicit and lock-resolved.
override-dependencies = ["numpy>=2", "websockets==15.0.1"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com"
explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
